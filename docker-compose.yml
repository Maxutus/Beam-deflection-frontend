services:
  app:
    container_name: beams-frontend
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 3000:3000
    environment:
      - API_TARGET=http://host.docker.internal:8080
      - MINIO_TARGET=http://host.docker.internal:9100
    command: npm run dev
